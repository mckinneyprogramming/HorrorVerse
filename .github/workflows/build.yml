name: SonarCloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarScanner
        id: cache
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner
        if: steps.cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force
          dotnet tool install dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & .\.sonar\scanner\dotnet-sonarscanner.exe begin `
            /k:"mckinneyprogramming_HorrorTracker" `
            /o:"mckinneyprogramming" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.scanner.scanAll=true `
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/.vite/**,HorrorTracker.Api/wwwroot/**"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Sonar begin command failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          if (!(Test-Path .sonarqube)) {
            Write-Error "Sonar begin FAILED. .sonarqube folder not created."
            exit 1
          }

          dotnet build HorrorTracker.sln --no-incremental

          & .\.sonar\scanner\dotnet-sonarscanner.exe end /d:sonar.token="$env:SONAR_TOKEN"
