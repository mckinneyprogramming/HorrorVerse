name: SonarCloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horror
          POSTGRES_PASSWORD: horror
          POSTGRES_DB: HorrorTracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horror -d HorrorTracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HorrorVerseDb: Host=localhost;Username=horror;Password=horror;Database=HorrorTracker
      ADMIN_EMAIL: ash@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HorrorTracker.WebApp/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarScanner
        id: cache
        uses: actions/cache@v5
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sonar/scanner
          dotnet tool install dotnet-sonarscanner --tool-path .sonar/scanner

      - name: Require the HorrorVerse coverage gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          token = os.environ.get("SONAR_TOKEN", "").strip()
          if not token:
              raise SystemExit("SONAR_TOKEN is missing. Add a SonarCloud token as the SONAR_TOKEN GitHub Actions secret.")

          org = "mckinneyprogramming"
          gate = "HorrorVerse Coverage"
          project = "mckinneyprogramming_HorrorTracker"

          def call(method, path, params):
              query = urllib.parse.urlencode(params)
              data = None
              url = "https://sonarcloud.io/api" + path
              if method == "GET":
                  url += "?" + query
              else:
                  data = query.encode()
              request = urllib.request.Request(url, data=data, method=method)
              request.add_header("Authorization", f"Bearer {token}")
              if data is not None:
                  request.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(request) as response:
                      raw = response.read().decode()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read().decode()
                  print(f"{method} {path} returned {error.code}: {raw}")
                  return error.code, raw

          def reject_unauthorized(status):
              if status == 401:
                  raise SystemExit(
                      "SonarCloud rejected SONAR_TOKEN. Generate a user token for an account that can administer quality gates in the mckinneyprogramming organization, then replace the SONAR_TOKEN GitHub secret."
                  )

          status, body = call("GET", "/qualitygates/show", {"organization": org, "name": gate})
          reject_unauthorized(status)
          if status != 200:
              status, body = call("POST", "/qualitygates/create", {"organization": org, "name": gate})
              reject_unauthorized(status)
              if status != 200:
                  raise SystemExit(f"Could not create the {gate} quality gate.")

          gate_id = body["id"]
          status, shown = call("GET", "/qualitygates/show", {"organization": org, "id": gate_id})
          reject_unauthorized(status)
          if status != 200:
              raise SystemExit(f"Could not read quality gate {gate_id}.")

          coverage = next((item for item in shown.get("conditions", []) if item.get("metric") == "coverage"), None)
          if coverage is None:
              status, _ = call("POST", "/qualitygates/create_condition", {
                  "organization": org,
                  "gateId": gate_id,
                  "metric": "coverage",
                  "op": "LT",
                  "error": "100",
              })
              reject_unauthorized(status)
              if status != 200:
                  raise SystemExit("Could not add the coverage condition.")
          elif coverage.get("op") != "LT" or str(coverage.get("error")) != "100":
              status, _ = call("POST", "/qualitygates/update_condition", {
                  "organization": org,
                  "id": coverage["id"],
                  "metric": "coverage",
                  "op": "LT",
                  "error": "100",
              })
              reject_unauthorized(status)
              if status != 200:
                  raise SystemExit("Could not update the coverage condition.")

          status, _ = call("POST", "/qualitygates/select", {
              "organization": org,
              "gateId": gate_id,
              "projectKey": project,
          })
          reject_unauthorized(status)
          if status not in (200, 204):
              raise SystemExit("Could not select the coverage quality gate for this project.")
          print(f"Selected quality gate {gate_id} ({gate}) for {project}.")
          PY

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is missing. Add a SonarCloud token as the SONAR_TOKEN GitHub Actions secret."
            exit 1
          fi

          .sonar/scanner/dotnet-sonarscanner begin \
            /k:"mckinneyprogramming_HorrorTracker" \
            /o:"mckinneyprogramming" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/.vite/**,**/coverage/**,**/TestResults/**,HorrorTracker.Api/wwwroot/**,HorrorTracker.WebApp/api/**,**/.github/**" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/*.test.ts,**/*.spec.ts,**/e2e/**,**/playwright.config.ts,**/vitest.config.ts,**/test-helpers/**,**/stryker.config.json" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="HorrorTracker.WebApp/coverage/lcov.info" \
            /d:sonar.qualitygate.wait=true

          test -d .sonarqube

          dotnet test HorrorTracker.sln --collect:"XPlat Code Coverage" --results-directory TestResults --settings coverlet.runsettings --logger "trx;LogFileName=integration.trx"

          cd HorrorTracker.WebApp
          npm ci
          npm run bundle-api -- --check
          npm run test:coverage
          cd ..

          .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Collect test results
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/api reports/web
          if [ -d TestResults ]; then
            i=0
            while IFS= read -r file; do
              i=$((i + 1))
              cp "$file" "reports/api/results-$i.trx"
            done < <(find TestResults -name '*.trx' | sort)
          fi
          if [ -f HorrorTracker.WebApp/test-results/vitest-junit.xml ]; then
            cp HorrorTracker.WebApp/test-results/vitest-junit.xml reports/web/vitest-junit.xml
          fi

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-tests
          path: reports/api/*.trx
          if-no-files-found: warn

      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-unit-tests
          path: reports/web/*.xml
          if-no-files-found: warn

      - name: Report API and integration tests
        if: >-
          always() &&
          hashFiles('reports/api/*.trx') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v3
        with:
          name: API and integration tests
          path: reports/api/*.trx
          reporter: dotnet-trx
          list-suites: all
          list-tests: all
          collapsed: never
          report-title: API and integration tests

      - name: Report web unit tests
        if: >-
          always() &&
          hashFiles('reports/web/*.xml') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v3
        with:
          name: Web unit tests
          path: reports/web/*.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          collapsed: never
          report-title: Web unit tests
