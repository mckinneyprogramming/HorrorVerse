name: SonarCloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Setup .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      # 3️⃣ Setup JDK 17 for SonarScanner
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'

      # 4️⃣ Cache SonarScanner
      - name: Cache SonarScanner
        id: cache
        uses: actions/cache@v3
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner

      # 5️⃣ Install SonarScanner if not cached
      - name: Install SonarScanner
        if: steps.cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force
          dotnet tool install dotnet-sonarscanner --tool-path .\.sonar\scanner

      # 6️⃣ Install ReportGenerator (for coverage merging)
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      # 7️⃣ Build, test, and analyze
      - name: Build, Test, Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # Begin SonarCloud analysis
          $ErrorActionPreference = "Stop"

          & .\.sonar\scanner\dotnet-sonarscanner.exe begin `
          /k:"mckinneyprogramming_HorrorTracker" `
          /o:"mckinneyprogramming" `
          /d:sonar.token="$env:SONAR_TOKEN" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.verbose=true `
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Sonar begin command failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          if (!(Test-Path .sonarqube)) {
            Write-Error "Sonar begin FAILED. .sonarqube folder not created."
            exit 1
          }

          # Build the solution
          dotnet build HorrorTracker.sln --no-incremental

          # Run all tests with coverage (using OpenCover format)
          dotnet test HorrorTracker.sln --no-build `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          # Debug - show all test results
          echo "=== Test Results Directory Structure ==="
          Get-ChildItem TestResults -Recurse | Select-Object FullName

          # Check if coverage files exist
          $coverageFiles = Get-ChildItem -Path TestResults -Filter "coverage.opencover.xml" -Recurse
          if ($coverageFiles.Count -eq 0) {
            Write-Warning "No OpenCover coverage files found!"
          } else {
            echo "=== Found $($coverageFiles.Count) coverage file(s) ==="
            $coverageFiles | ForEach-Object { echo $_.FullName }
          }

          # End SonarCloud analysis
          & .\.sonar\scanner\dotnet-sonarscanner.exe end /d:sonar.token="$env:SONAR_TOKEN"
