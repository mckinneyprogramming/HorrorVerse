name: SonarCloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horror
          POSTGRES_PASSWORD: horror
          POSTGRES_DB: HorrorTracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horror -d HorrorTracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HorrorVerseDb: Host=localhost;Username=horror;Password=horror;Database=HorrorTracker
      ADMIN_EMAIL: ash@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HorrorTracker.WebApp/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarScanner
        id: cache
        uses: actions/cache@v5
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sonar/scanner
          dotnet tool install dotnet-sonarscanner --tool-path .sonar/scanner

      - name: Require the HorrorVerse coverage gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request

          token = os.environ.get("SONAR_TOKEN", "")
          if not token:
              raise SystemExit("SONAR_TOKEN is missing. Add a SonarCloud token as the SONAR_TOKEN GitHub Actions secret.")

          org = "mckinneyprogramming"
          gate = "HorrorVerse Coverage"
          project = "mckinneyprogramming_HorrorTracker"
          auth = "Basic " + base64.b64encode(f"{token}:".encode()).decode()

          def call(method, path, params):
              url = "https://sonarcloud.io/api" + path + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, method=method)
              request.add_header("Authorization", auth)
              try:
                  with urllib.request.urlopen(request) as response:
                      raw = response.read().decode()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read().decode()
                  print(f"{method} {path} returned {error.code}: {raw}")
                  return error.code, raw

          status, body = call("GET", "/qualitygates/show", {"organization": org, "name": gate})
          if status != 200:
              status, body = call("POST", "/qualitygates/create", {"organization": org, "name": gate})
              if status != 200:
                  raise SystemExit(f"Could not create the {gate} quality gate.")

          gate_id = body["id"]
          status, shown = call("GET", "/qualitygates/show", {"organization": org, "id": gate_id})
          if status != 200:
              raise SystemExit(f"Could not read quality gate {gate_id}.")

          coverage = next((item for item in shown.get("conditions", []) if item.get("metric") == "coverage"), None)
          if coverage is None:
              status, _ = call("POST", "/qualitygates/create_condition", {
                  "organization": org,
                  "gateId": gate_id,
                  "metric": "coverage",
                  "op": "LT",
                  "error": "100",
              })
              if status != 200:
                  raise SystemExit("Could not add the coverage condition.")
          elif coverage.get("op") != "LT" or str(coverage.get("error")) != "100":
              status, _ = call("POST", "/qualitygates/update_condition", {
                  "organization": org,
                  "id": coverage["id"],
                  "metric": "coverage",
                  "op": "LT",
                  "error": "100",
              })
              if status != 200:
                  raise SystemExit("Could not update the coverage condition.")

          status, _ = call("POST", "/qualitygates/select", {
              "organization": org,
              "gateId": gate_id,
              "projectKey": project,
          })
          if status not in (200, 204):
              raise SystemExit("Could not select the coverage quality gate for this project.")
          print(f"Selected quality gate {gate_id} ({gate}) for {project}.")
          PY

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is missing. Add a SonarCloud token as the SONAR_TOKEN GitHub Actions secret."
            exit 1
          fi

          .sonar/scanner/dotnet-sonarscanner begin \
            /k:"mckinneyprogramming_HorrorTracker" \
            /o:"mckinneyprogramming" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/.vite/**,**/coverage/**,**/TestResults/**,HorrorTracker.Api/wwwroot/**,HorrorTracker.WebApp/api/**" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/*.test.ts,**/*.spec.ts,**/e2e/**,**/playwright.config.ts,**/vitest.config.ts,**/test-helpers/**,**/stryker.config.json" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="HorrorTracker.WebApp/coverage/lcov.info" \
            /d:sonar.qualitygate.wait=true

          test -d .sonarqube

          dotnet test HorrorTracker.sln --collect:"XPlat Code Coverage" --results-directory TestResults --settings coverlet.runsettings

          cd HorrorTracker.WebApp
          npm ci
          npm run bundle-api -- --check
          npm run test:coverage
          cd ..

          .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
