name: SonarCloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horror
          POSTGRES_PASSWORD: horror
          POSTGRES_DB: HorrorTracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horror -d HorrorTracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HorrorVerseDb: Host=localhost;Username=horror;Password=horror;Database=HorrorTracker
      ADMIN_EMAIL: ash@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HorrorTracker.WebApp/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarScanner
        id: cache
        uses: actions/cache@v5
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sonar/scanner
          dotnet tool install dotnet-sonarscanner --tool-path .sonar/scanner

      - name: Require the HorrorVerse coverage gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is missing. Add a SonarCloud token as the SONAR_TOKEN GitHub Actions secret."
            exit 1
          fi
          gate="HorrorVerse Coverage"
          auth=(-u "${SONAR_TOKEN}:")
          code=$(curl -s -o /tmp/gate.json -w "%{http_code}" "${auth[@]}" -X POST \
            "https://sonarcloud.io/api/qualitygates/create?organization=mckinneyprogramming&name=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("HorrorVerse Coverage"))')")
          if [ "$code" != "200" ]; then
            echo "Quality gate create returned $code (it may already exist)."
            cat /tmp/gate.json || true
          fi
          curl -fsS "${auth[@]}" -X POST \
            --data-urlencode "gateName=${gate}" \
            --data-urlencode "metric=coverage" \
            --data-urlencode "op=LT" \
            --data-urlencode "error=100" \
            "https://sonarcloud.io/api/qualitygates/create_condition" || true
          curl -fsS "${auth[@]}" -X POST \
            --data-urlencode "organization=mckinneyprogramming" \
            --data-urlencode "gateName=${gate}" \
            --data-urlencode "projectKey=mckinneyprogramming_HorrorTracker" \
            "https://sonarcloud.io/api/qualitygates/select"

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is missing. Add a SonarCloud token as the SONAR_TOKEN GitHub Actions secret."
            exit 1
          fi

          .sonar/scanner/dotnet-sonarscanner begin \
            /k:"mckinneyprogramming_HorrorTracker" \
            /o:"mckinneyprogramming" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/.vite/**,**/coverage/**,**/TestResults/**,HorrorTracker.Api/wwwroot/**,HorrorTracker.WebApp/api/**" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/*.test.ts,**/*.spec.ts,**/e2e/**,**/playwright.config.ts,**/vitest.config.ts,**/test-helpers/**,**/stryker.config.json" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="HorrorTracker.WebApp/coverage/lcov.info" \
            /d:sonar.qualitygate.wait=true

          test -d .sonarqube

          dotnet test HorrorTracker.sln --collect:"XPlat Code Coverage" --results-directory TestResults --settings coverlet.runsettings

          cd HorrorTracker.WebApp
          npm ci
          npm run bundle-api -- --check
          npm run test:coverage
          cd ..

          .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
