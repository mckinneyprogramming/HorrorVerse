name: Test dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - SonarCloud Analysis
      - Browser journeys
      - Deploy smoke
    types:
      - completed

concurrency:
  group: test-dashboard
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'master' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Collect the latest results
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_UPDATED: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p public/data

          fetch_run() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${1}/runs?branch=master&status=completed&exclude_pull_requests=true&per_page=10" \
              --jq '[.workflow_runs[] | select(.event != "workflow_run")][0] | [.id, .html_url, .name] | @tsv'
          }

          save_artifact() {
            local workflow="$1"
            local artifact="$2"
            local row run_id html_url run_name
            row="$(fetch_run "$workflow" || true)"
            run_id=""
            html_url=""
            run_name=""
            if [ -n "${row}" ]; then
              IFS=$'\t' read -r run_id html_url run_name <<< "${row}" || true
            fi
            if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
              echo "No completed ${workflow} run to publish."
              return
            fi
            mkdir -p "public/data/${artifact}"
            if gh run download "${run_id}" --name "${artifact}" --dir "public/data/${artifact}"; then
              printf '%s\n%s\n' "${html_url}" "${run_name}" > "public/data/${artifact}/source.txt"
              echo "Saved ${artifact} from run ${run_id}."
            else
              rm -rf "public/data/${artifact}"
              echo "Run ${run_id} has no ${artifact} artifact."
            fi
          }

          save_artifact build.yml api-integration-tests
          save_artifact build.yml web-unit-tests
          save_artifact e2e.yml browser-journeys
          save_artifact smoke.yml deploy-smoke

          if [ -z "${DASHBOARD_UPDATED}" ]; then
            DASHBOARD_UPDATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          DASHBOARD_UPDATED="${DASHBOARD_UPDATED}" python3 .github/workflows/render_test_dashboard.py public/data public/index.html
          : > public/.nojekyll

      - name: Publish the dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: public
          publish_branch: gh-pages
          commit_message: "Update the test dashboard."

      - name: Link the dashboard
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          {
            echo "### Test dashboard"
            echo ""
            echo "[Open the dashboard]($url)"
            echo ""
            echo "Run this workflow any time from the Actions tab. It republishes the latest API, web, browser, and smoke results together."
          } >> "$GITHUB_STEP_SUMMARY"
